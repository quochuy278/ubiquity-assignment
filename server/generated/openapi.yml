info:
  title: Ubiquity API
  description: Ubiquity Assignment API documentation
  version: "1.0"
  contact: {}
tags:
  - name: app
  - name: auth
  - name: groups
  - name: todo-lists
  - name: todos
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AppResponseDto:
      type: object
      properties:
        message:
          type: string
          example: Hello World!
      required:
        - message
    ErrorCode:
      type: string
      enum:
        - TASK_NOT_FOUND
        - TODO_LIST_NOT_FOUND
        - GROUP_NOT_FOUND
        - EMAIL_ALREADY_REGISTERED
        - INVALID_CREDENTIALS
        - UNAUTHORIZED
        - INVALID_REFRESH_TOKEN
        - VALIDATION_ERROR
        - INTERNAL_ERROR
    ErrorResponseDto:
      type: object
      properties:
        code:
          example: INTERNAL_ERROR
          allOf:
            - $ref: "#/components/schemas/ErrorCode"
      required:
        - code
    RegisterRequestDto:
      type: object
      properties:
        email:
          type: string
          example: alex@example.com
        password:
          type: string
          example: correct-horse-battery-staple
          minLength: 3
        displayName:
          type: string
          example: Alex
          minLength: 1
          maxLength: 100
      required:
        - email
        - password
        - displayName
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - displayName
        - avatarUrl
        - createdAt
        - updatedAt
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Access token lifetime in seconds
          example: 900
        user:
          $ref: "#/components/schemas/UserResponseDto"
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
    ValidationErrorDetailDto:
      type: object
      properties:
        field:
          type: string
          example: password
        messages:
          example:
            - password must be longer than or equal to 8 characters
          type: array
          items:
            type: string
      required:
        - field
        - messages
    ValidationErrorResponseDto:
      type: object
      properties:
        code:
          example: INTERNAL_ERROR
          allOf:
            - $ref: "#/components/schemas/ErrorCode"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorDetailDto"
      required:
        - code
        - errors
    LoginRequestDto:
      type: object
      properties:
        email:
          type: string
          example: alex@example.com
        password:
          type: string
          example: correct-horse-battery-staple
      required:
        - email
        - password
    RefreshRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Opaque refresh token returned by register, login, or refresh
      required:
        - refreshToken
    LogoutResponseDto:
      type: object
      properties: {}
    GroupType:
      type: string
      enum:
        - PERSONAL
        - SHARED
    GroupResponseDto:
      type: object
      properties:
        id:
          type: string
        type:
          allOf:
            - $ref: "#/components/schemas/GroupType"
        name:
          type: string
        createdById:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - name
        - createdById
        - createdAt
        - updatedAt
    CreateGroupDto:
      type: object
      properties:
        type:
          allOf:
            - $ref: "#/components/schemas/GroupType"
        name:
          type: string
          example: Family
      required:
        - type
        - name
    CreateTodoListDto:
      type: object
      properties:
        name:
          type: string
          example: Shopping
        icon:
          type: string
          example: shopping-cart
        color:
          type: string
          example: "#2563EB"
      required:
        - name
    TodoListResponseDto:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        rank:
          type: string
          example: "1000"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - groupId
        - name
        - icon
        - color
        - rank
        - createdAt
        - updatedAt
    CreateTodoDto:
      type: object
      properties:
        title:
          type: string
          example: Buy groceries
        description:
          type: string
          nullable: true
          example: Milk, eggs, and bread
        dueDate:
          type: string
          format: date-time
          nullable: true
          example: 2026-08-10T18:00:00.000Z
      required:
        - title
    TodoStatus:
      type: number
      enum:
        - 10
        - 20
    TodoResponseDto:
      type: object
      properties:
        id:
          type: string
        todoListId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          allOf:
            - $ref: "#/components/schemas/TodoStatus"
        rank:
          type: string
          example: "1000"
        dueDate:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        assignedToId:
          type: string
          nullable: true
        createdById:
          type: string
        updatedById:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - todoListId
        - title
        - description
